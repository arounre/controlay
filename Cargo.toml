[package]
name = "controlay"
version = "1.0.0"
edition = "2024"
authors = ["arounre"]
description = "Windows receiver for Controlay: Emulate game controllers on PC using your Android phone as a wireless bridge."
homepage = "https://github.com/arounre/controlay"
repository = "https://github.com/arounre/controlay"
documentation = "https://github.com/arounre/controlay#usage"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["controller", "emulation", "gaming", "network", "android"]
categories = ["emulators", "hardware-support"]

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = [
    "persistence",
    "glow",
] }
egui = "0.34.1"
egui_commonmark = { version = "0.23.0", default-features = false }
hostname = "0.4.2"
local-ip-address = "0.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
tray-icon = "0.23.0"
vigem-rust = "0.1.1"
winit = "0.30.12"
# used in flip_window_visibility for tray support workaround
windows = { version = "0.62.2", features = [
    "Win32",
    "Win32_UI",
    "Win32_UI_WindowsAndMessaging",
] }
single-instance = "0.3.3"
native-dialog = "0.9.4"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
semver = "1.0.27"
anyhow = "1.0.100"
notify-rust = "4.17.0"

[build-dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"] }
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.packager]
product-name = "Controlay"
identifier = "com.arounre.controlay"
formats = ["nsis", "wix"]

[[package.metadata.packager.binaries]]
path = "controlay.exe"
main = true

[package.metadata.release]
publish = false
push = true
tag-name = "v{{version}}"
